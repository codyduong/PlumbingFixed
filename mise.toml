# mise — standardized dev toolchain
# https://mise.jdx.dev  |  Install: winget install jdx.mise   (then: mise install)
#
# `mise install`      provisions the pinned tools below into an isolated per-project env.
# `mise tasks`        lists every workflow.
# `mise run <task>`   runs one.  `mise run <task> --help`  shows its arguments.
#
# Each task shells out to a script in ./tooling/scripts — a git submodule sourced from
# https://github.com/codyduong/Project-Zomboid-Template, pinned to a tag (see
# `git -C tooling status`), not tracking main. `run` is the POSIX-sh command (Linux/macOS,
# calls the .sh twin), `run_windows` overrides it on Windows (calls the .ps1 twin) — mise's
# own per-OS task mechanism, driven by `[settings] windows_default_inline_shell_args` below.
# Both are also runnable directly: `bash tooling/scripts/<name>.sh ...` or
# `pwsh -File tooling/scripts/<name>.ps1 ...`.
#
# Secrets for publishing (STEAM_USER, etc.) go in mise.local.toml — copy it from
# mise.local.toml.example. That file is git-ignored and auto-loaded with higher precedence.

min_version = "2026.4.0"

[settings]
windows_default_inline_shell_args = "pwsh -NoProfile -Command"
experimental = true

[tools]
"cargo:emmylua_formatter" = "0.24.0"
"cargo:emmylua_check" = "0.24.0"
java = "temurin-17"
age = "1.3.1"

[env]
STEAM_USERNAME = { required = "Set STEAM_USERNAME to your Steam username in mise.local.toml" }
STEAM_PASSWORD = { required = "Set STEAM_PASSWORD to your Steam password in mise.local.toml" }

[tasks.check]
description = "Lint + type-check Lua (luafmt + emmylua_check); mirrors CI"
run = "bash tooling/scripts/check.sh"
run_windows = "& tooling/scripts/check.ps1"

[tasks.decompile]
description = "Decompile the installed game into .decompiled/<version>/ for client/server analysis"
usage = 'arg "<version>" help="PZ build being decompiled, e.g. 42.20.2 (Major.Minor.Patch; see docs/UPDATING-PZ.md #0)"'
run = 'bash tooling/scripts/decompile.sh "$usage_version"'
run_windows = '& tooling/scripts/decompile.ps1 -Version $env:usage_version'

[tasks.bump]
description = "Set the mod's semver in every mod.info (not the targeted PZ build)"
usage = 'arg "<version>" help="Mod semver to set, e.g. 1.3.14 (leading v optional)"'
run = 'bash tooling/scripts/bump-version.sh "$usage_version"'
run_windows = '& tooling/scripts/bump-version.ps1 $env:usage_version'

[tasks.package]
description = "Validate mod.info versions against the tag, then build dist/PlumbingFixed"
usage = 'arg "<tag>" help="Release tag to validate against, e.g. v1.3.14"'
run = 'bash tooling/scripts/package.sh "$usage_tag"'
run_windows = '& tooling/scripts/package.ps1 $env:usage_tag'

[tasks.deploy]
description = "Package + sync for in-game testing (client=Workshop dev dir, server=testhost mods dir)"
usage = '''
arg "<target>" help="Where to deploy: client, server, or all" {
  choices "client" "server" "all"
}
'''
run = 'bash tooling/scripts/deploy-local.sh "$usage_target"'
run_windows = '& tooling/scripts/deploy-local.ps1 $env:usage_target'

[tasks.steam-login]
description = "Log in to steamcmd to cache the Steam session (password + Steam Guard prompt)"
raw = true
sources = ["~/AppData/Local/Microsoft/WinGet/Packages/Valve*/Config/config.vdf"]
run = 'steamcmd +login "$STEAM_USERNAME" "$STEAM_PASSWORD" +quit'
run_windows = 'steamcmd +login $env:STEAM_USERNAME $env:STEAM_PASSWORD +quit'

[tasks.publish]
description = "Publish to Steam Workshop via steamcmd (needs STEAM_USER; see mise.local.toml)"
raw = true
depends = ["steam-login"]
usage = '''
arg "<target>" help="Which item to publish: test or prod (required — no implicit target)" {
  choices "test" "prod"
}
arg "[changenote]" help="Workshop changenote for this update" default=""
flag "-f --file <file>" help="Read the changenote from a bbcode file (instead of [changenote])"
'''
run = 'bash tooling/scripts/publish-workshop.sh "$usage_target" "$usage_changenote" --changenote-file "$usage_file"'
run_windows = '& tooling/scripts/publish-workshop.ps1 $env:usage_target $env:usage_changenote -ChangeNoteFile $env:usage_file'

[tasks.testhost]
description = "Run an ephemeral local dedicated server for MP testing (state in .testhost/)"
raw = true
usage = 'flag "--reset" help="Delete the .testhost world and reprovision from testhost/ seeds"'
run = '''
if [ "$usage_reset" = "true" ]; then
  bash tooling/scripts/testhost.sh --reset
else
  bash tooling/scripts/testhost.sh
fi
'''
run_windows = '& tooling/scripts/testhost.ps1 -Reset:($env:usage_reset -eq "true")'

[tasks.sync-template]
description = "Pull the latest tooling/ (Project-Zomboid-Template) submodule commit"
raw = true
run = '''
git submodule update --remote tooling
git add tooling
echo "tooling/ updated. Review 'git diff --staged tooling', then commit."
'''
run_windows = '''
git submodule update --remote tooling
git add tooling
Write-Host "tooling/ updated. Review 'git diff --staged tooling', then commit." -ForegroundColor Cyan
'''

[tasks.sync-umbrella]
description = "Pin the Umbrella type-stub submodule to a PZ build tag (or the latest available tag if omitted)"
raw = true
usage = 'arg "[version]" help="PZ build tag to pin Umbrella to, e.g. 42.19.0 (omit for the latest available semver tag)"'
run = '''
git -C Umbrella fetch --tags -q
version="$usage_version"
if [ -z "$version" ]; then
  # Umbrella tags itself per PZ build (plus non-semver aliases like "stable"/"unstable" we
  # don't want here); pick the newest Major.Minor.Patch tag rather than tracking a branch,
  # since main can carry in-progress stubs for an unreleased build (see docs/UPDATING-PZ.md).
  version="$(git -C Umbrella tag --list --sort=-v:refname | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | head -n1)"
  if [ -z "$version" ]; then
    echo "ERROR: no Major.Minor.Patch tags found on Umbrella." >&2
    exit 1
  fi
  echo "No version given; using latest available tag: $version"
fi
if ! git -C Umbrella checkout "$version"; then
  echo "ERROR: Umbrella has no tag '$version'." >&2
  exit 1
fi
git add Umbrella
echo "Umbrella pinned to $version. Review 'git diff --staged Umbrella', then commit."
'''
run_windows = '''
git -C Umbrella fetch --tags -q
$version = "$env:usage_version".Trim('"')
if (-not $version) {
  # Umbrella tags itself per PZ build (plus non-semver aliases like "stable"/"unstable" we
  # don't want here); pick the newest Major.Minor.Patch tag rather than tracking a branch,
  # since main can carry in-progress stubs for an unreleased build (see docs/UPDATING-PZ.md).
  $version = git -C Umbrella tag --list --sort=-v:refname | Where-Object { $_ -match '^\d+\.\d+\.\d+$' } | Select-Object -First 1
  if (-not $version) {
    Write-Host "ERROR: no Major.Minor.Patch tags found on Umbrella." -ForegroundColor Red
    exit 1
  }
  Write-Host "No version given; using latest available tag: $version" -ForegroundColor Yellow
}
git -C Umbrella checkout $version
if ($LASTEXITCODE -ne 0) {
  Write-Host "ERROR: Umbrella has no tag '$version'." -ForegroundColor Red
  exit 1
}
git add Umbrella
Write-Host "Umbrella pinned to $version. Review 'git diff --staged Umbrella', then commit." -ForegroundColor Cyan
'''
