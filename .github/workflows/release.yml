name: Release Mod

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Version Tag (e.g., v1.0.1)'
        required: true
        type: string

jobs:
  call:
    uses: codyduong/Project-Zomboid-Template/.github/workflows/release.yml@v0.1.1
    with:
      tag_name: ${{ inputs.tag_name }}
      mod_name: PlumbingFixed
    secrets: inherit
